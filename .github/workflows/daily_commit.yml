name: Daily Auto Commit

on:
  schedule:
    # Runs every day at 12:00 UTC (5:30 PM IST).
    # GitHub schedules may run up to 1 hour late — noon UTC is a safe, reliable slot.
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Uses the built-in GITHUB_TOKEN — no PAT needed for same-repo pushes.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history so we can always push cleanly.
          fetch-depth: 0

      - name: Configure Git
        run: |
          # IMPORTANT: This email MUST match a verified email on the Priyanshukumar31
          # GitHub account, otherwise commits won't count as contributions.
          git config user.email "guttukr5@gmail.com"
          git config user.name "Priyanshukumar31"

      - name: Make daily commit
        run: |
          DATE=$(date -u '+%Y-%m-%d')
          DATETIME=$(date -u '+%Y-%m-%d %H:%M UTC')

          # Append today's entry to the activity log (creates it if it doesn't exist).
          echo "Contribution: $DATETIME" >> activity_log.txt

          git add activity_log.txt

          # Only commit if there are actual staged changes — prevents empty-commit errors.
          if git diff --cached --quiet; then
            echo "No changes to commit — skipping."
          else
            git commit -m "Daily contribution: $DATE"
            echo "Commit created for $DATE"
          fi

      - name: Push changes
        run: |
          # Push to the default branch (main).
          git push origin main
